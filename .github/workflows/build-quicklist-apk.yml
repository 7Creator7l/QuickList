name: Build QuickList Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find QuickList project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'QuickList*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "QuickList Android ZIP not found"
            exit 1
          fi

          echo "Found project: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract QuickList project
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          echo "Project contents:"
          find project -maxdepth 3 -type f | sort

      - name: Locate Android project
        run: |
          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "Android project found in project/"
          else
            INNER=$(find project -maxdepth 2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

            if [ -z "$INNER" ]; then
              echo "settings.gradle not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$INNER")
            echo "Android project found in: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set project directory
        run: |
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - name: Fix Kotlin dependency conflict
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle <<'EOF'

          // QuickList Kotlin dependency compatibility fix
          configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      if (details.requested.name == "kotlin-stdlib" ||
                          details.requested.name == "kotlin-stdlib-jdk7" ||
                          details.requested.name == "kotlin-stdlib-jdk8") {
                          details.useVersion("1.8.22")
                          details.because("Use one compatible Kotlin stdlib version")
                      }
                  }
              }
          }
          EOF

          echo "Kotlin dependency fix added."

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quicklist-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
