name: Build QuickList Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find QuickList project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'QuickList*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: QuickList Android ZIP not found"
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "Found project: $ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Fix Kotlin dependency conflict
        run: |
          echo "Fixing Kotlin duplicate class dependencies..."

          cat >> project/build.gradle <<'EOF'

          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

              resolutionStrategy.force(
                  "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
              )
          }
          EOF

          echo "Final project/build.gradle:"
          cat project/build.gradle

      - name: Check Android project
        run: |
          if [ ! -f project/settings.gradle ] && [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found"
            find project -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -d project/app ]; then
            echo "ERROR: app directory not found"
            find project -maxdepth 4 -type d
            exit 1
          fi

          echo "Android project detected successfully."

      - name: Build Release APK
        working-directory: project
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find project/app/build/outputs -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quicklist-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
